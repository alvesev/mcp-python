apiVersion: v2
name: mcp-python-server
description: >-
  MCP server "mcp-python" - runs a Python 3 code, submitted by an MCP client,
  over the streamable HTTP transport (HTTP, HTTPS or both).
type: application

# Chart version - of the source tree. The chart package ('make chart-package')
# has the version of "mcp-python" instead, as 'appVersion' below.
# TODO - Implement the version injection; the version may be different with
#        the app version.
version: 0.2.0

# Version of "mcp-python" - the one of 'debian/changelog', which is also the
# tag of the image of 'make container'.
appVersion: "0.0.0"

keywords:
  - mcp
  - python
annotations:
  licenses: GPL-3.0-or-later
