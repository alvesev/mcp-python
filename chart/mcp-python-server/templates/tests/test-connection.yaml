{{- $port := ternary .Values.service.portHttps .Values.service.port (eq (include "mcp-python-server.listenerPort" .) "https") }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mcp-python-server.fullname" . }}-test-connection"
  labels:
    {{- include "mcp-python-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    # The listener accepts connections - TCP only, a plain GET is not an MCP request.
    - name: nc
      image: busybox:1.36
      command: ['nc', '-z', '-w', '5', '{{ include "mcp-python-server.fullname" . }}', '{{ $port }}']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
