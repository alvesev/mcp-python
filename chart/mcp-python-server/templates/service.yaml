{{- $variant := include "mcp-python-server.httpVariant" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-python-server.fullname" . }}
  labels:
    {{- include "mcp-python-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  ports:
    {{- if ne $variant "HTTPS" }}
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- end }}
    {{- if ne $variant "HTTP" }}
    - port: {{ .Values.service.portHttps }}
      targetPort: https
      protocol: TCP
      name: https
    {{- end }}
  selector:
    {{- include "mcp-python-server.selectorLabels" . | nindent 4 }}
