apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-python-server.fullname" . }}
  labels:
    {{- include "mcp-python-server.labels" . | nindent 4 }}
data:
  # Listens at all addresses of the pod - see 'networkPolicy'.
  MCP_HOST: "0.0.0.0"
  MCP_HTTP_VARIANT: {{ include "mcp-python-server.httpVariant" . | quote }}
  MCP_PORT: {{ .Values.ports.http | quote }}
  MCP_PORT_HTTPS: {{ .Values.ports.https | quote }}
  {{- if .Values.tls.enabled }}
  MCP_TLS_CERT: /run/mcp-python/tls.crt
  MCP_TLS_KEY: /run/mcp-python/tls.key
  {{- end }}
  # The account of the image - the one to drop to, when started as root.
  MCP_USER: mcp-python
  MCP_WORK_PYTHON: {{ .Values.config.workPython | quote }}
  MCP_SCRATCH: /var/lib/mcp-python/scratch
  MCP_EXEC_TIMEOUT: {{ .Values.config.execTimeout | quote }}
  MCP_OUTPUT_LIMIT: {{ .Values.config.outputLimit | quote }}
  MCP_AUTH: {{ ternary "token" "none" .Values.auth.enabled | quote }}
  {{- if .Values.auth.enabled }}
  # The Secret 'auth.secretName', mounted - a file per client. Without it -
  # the empty directory of the image.
  MCP_AUTH_TOKENS: /etc/mcp-python/tokens
  {{- end }}
