{{- if .Values.networkPolicy.enabled }}
{{- $variant := include "mcp-python-server.httpVariant" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-python-server.fullname" . }}
  labels:
    {{- include "mcp-python-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-python-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if kindIs "slice" .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- with .Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        {{- if ne $variant "HTTPS" }}
        - protocol: TCP
          port: http
        {{- end }}
        {{- if ne $variant "HTTP" }}
        - protocol: TCP
          port: https
        {{- end }}
  {{- if kindIs "slice" .Values.networkPolicy.egress }}
  egress:
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- else }} []
    {{- end }}
  {{- end }}
{{- end }}
