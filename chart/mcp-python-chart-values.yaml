##

##
# Values of the chart for 'mcp-python-chart' - the K3s cluster of the user.
# The image tag, the hosts of the Ingress and its TLS (the names of the TLS
# certificate of the user) are given by the launcher.
#
##

# Loaded into the node by the launcher, never pulled.
image:
  pullPolicy: Never

# The Secret of the token files of the user - made by the launcher.
auth:
  enabled: true
  secretName: mcp-python-tokens

# Traefik of K3s - HTTPS with the certificate of the user (the Secret
# 'mcp-python-tls', made by the launcher), plain HTTP to the pod within the
# cluster.
ingress:
  enabled: true
  className: traefik
