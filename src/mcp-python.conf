##

#
# Configuration of the MCP server 'mcp-python' - environment of the Systemd
# unit 'mcp-python.service'. After a change:
#
#   systemctl restart mcp-python
#
# A container takes the same settings as environment - the image has its
# own defaults, this file is not read there. To change them:
#
#   docker run --env MCP_EXEC_TIMEOUT=120 ... mcp-python
#   docker run --env-file ./mcp-python.conf ... mcp-python
#
# Authentication - a bearer token per client ('MCP_AUTH'). A client with a
# valid token executes a code as 'MCP_USER'. No clients after the
# installation - every request is refused, until one is added:
#
#   mcp-python-token add NAME
#
##

# Authentication - 'token' or 'none'. With 'none' any host, which reaches a
# listener, executes a code - keep the listeners within a trusted network.
MCP_AUTH=token

# Directory of the token files - a file per client, named as the client,
# with the SHA-256 of its token (not the token). Managed by
# 'mcp-python-token' ('add', 'list', 'remove'; '--dir' for another
# directory than the default one here). A change is noticed by the running
# server in a few seconds - no restart.
MCP_AUTH_TOKENS=/etc/mcp-python/tokens

# Seconds between the reads of the token files - or 'once': read at start,
# by root, before the privileges drop, never again. With 'once' the
# directory and the files may be readable by root only - a submitted code
# can not read even the hashes; a change of the clients needs a restart.
#MCP_AUTH_RELOAD_PERIOD=5

# Listen address.
MCP_HOST=127.0.0.1

# Which listeners to start - HTTP, HTTPS or both.
MCP_HTTP_VARIANT=HTTP

# HTTP listen port.
MCP_PORT=8765

# HTTPS listen port.
MCP_PORT_HTTPS=8766

# TLS certificate and key (PEM), for HTTPS. Read by root at start, before
# the privileges drop.
#MCP_TLS_CERT=/etc/ssl/certs/mcp-python.crt
#MCP_TLS_KEY=/etc/ssl/private/mcp-python.key

# Account to serve as, and so to run a submitted code as.
MCP_USER=mcp-python

# Interpreter for a submitted code ('workload'), e.g. of a virtual
# environment with the packages a client needs.
MCP_WORK_PYTHON=/usr/bin/python3

# Directory for per call temporary directories. Must be writable by
# 'MCP_USER' - other directories are read only for the service.
MCP_SCRATCH=/var/lib/mcp-python/scratch

# Seconds, upper limit for a single 'run_python' call.
MCP_EXEC_TIMEOUT=60

# Characters of 'stdout' and 'stderr' (each) returned to a client.
MCP_OUTPUT_LIMIT=65536
